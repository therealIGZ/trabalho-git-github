<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Organizador de tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <span class="pill">PROJETO DE GIT E GITHUB</span>
    <h1>TaskFlow</h1>
    <p class="subtitle">Organize suas atividades em um lugar simples.</p>
    <section class="panel" aria-labelledby="titulo-tarefas">
      <div class="panel-top">
        <h2 id="titulo-tarefas">Minhas tarefas</h2>
        <span id="contador" class="counter">0 tarefas</span>
      </div>
      <div class="empty">
        <strong>Nenhuma tarefa por enquanto.</strong>
        As próximas funcionalidades serão adicionadas por branches.
      </div>
    </section>
    <footer>TaskFlow · Trabalho prático de versionamento</footer>
  </main>
</body>
</html>
