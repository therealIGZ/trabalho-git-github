<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Organizador de tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <span class="pill">PROJETO DE GIT E GITHUB</span>
    <h1>TaskFlow</h1>
    <p class="subtitle">Organize suas atividades em um lugar simples.</p>
    <section class="panel" aria-labelledby="titulo-tarefas">
      <div class="panel-top">
        <h2 id="titulo-tarefas">Minhas tarefas</h2>
        <span id="contador" class="counter">0 tarefas</span>
      </div>
      <form id="form-tarefa" class="form">
        <input id="nova-tarefa" type="text" placeholder="O que você precisa fazer?" maxlength="100" required aria-label="Nome da nova tarefa">
        <button type="submit">Adicionar</button>
      </form>
      <nav class="filter-bar" aria-label="Filtros de tarefas">
        <button class="filter-button active" data-filter="todas" type="button">Todas</button>
        <button class="filter-button" data-filter="pendentes" type="button">Pendentes</button>
        <button class="filter-button" data-filter="concluidas" type="button">Concluídas</button>
      </nav>
      <ul id="lista-tarefas" class="task-list" aria-live="polite"></ul>
      <div id="estado-vazio" class="empty">
        <strong>Nenhuma tarefa nesta visualização.</strong>
        Adicione uma tarefa ou escolha outro filtro.
      </div>
    </section>
    <footer>TaskFlow · Trabalho prático de versionamento</footer>
  </main>
</body>
</html>
